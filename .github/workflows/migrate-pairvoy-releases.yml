name: Migrate Pairvoy release downloads
on:
  push:
    branches: [master]
    paths: ['.github/pairvoy-release-migration.json']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tag: [pairvoy-v0.5.19, pairvoy-v0.5.16, pairvoy-v0.5.15, tandem-v0.5.14]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify and migrate the public release
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRVOY_TAG: ${{ matrix.tag }}
        run: python3 .github/scripts/migrate-pairvoy-release.py
